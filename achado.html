<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Entre para receber promoções de beleza, cosméticos, cuidados pessoais e achadinhos.">
<meta name="theme-color" content="#ff43ad">
<title>Clube de Ofertas | Beleza e Achadinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff43ad; --pink-deep:#d61b86; --pink-soft:#f5a1d9; --pink-pale:#fff0fa;
  --yellow:#fff23b; --ink:#210d1b; --muted:#68485c;
  --green:#0bc03a; --green-2:#05a531; --glow:rgba(11,192,58,.45);
  --head:'Bricolage Grotesque',Georgia,serif; --body:'DM Sans',Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--pink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}

/* ---------- Hero ---------- */
.hero{min-height:610px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:48px 20px 64px;position:relative;overflow:hidden;
  background:radial-gradient(900px 420px at 50% -10%,#ffb8e4 0,transparent 60%),
             linear-gradient(135deg,#ff7bca,var(--pink) 60%,#ff1f98)}
.float{position:absolute;font-size:32px;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(80,0,40,.25));pointer-events:none}
.f1{left:8%;top:20%}.f2{right:9%;top:16%;animation-delay:-2s}.f3{left:11%;bottom:20%;animation-delay:-4s}.f4{right:12%;bottom:24%;animation-delay:-1s}
.spark{position:absolute;color:#ffe3f3;font-size:20px;animation:twinkle 3s ease-in-out infinite;pointer-events:none}
.hero-inner{max-width:780px;position:relative;z-index:1}
.logo-badge{width:92px;height:92px;border:2px solid var(--yellow);border-radius:50%;display:grid;place-items:center;
  margin:0 auto 20px;color:var(--yellow);font-family:var(--head);font-weight:800;font-size:13px;line-height:1.05;
  background:rgba(255,255,255,.08);animation:spinIn 1s ease both, wobble 5s ease-in-out 1s infinite}
.kicker{color:var(--yellow);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:.78rem;margin-bottom:13px}
h1{font-family:var(--head);font-weight:800;color:var(--yellow);font-size:clamp(2.5rem,6vw,4.8rem);line-height:.98;
  letter-spacing:-1.5px;margin:0 auto 18px;max-width:760px;text-shadow:0 3px 0 rgba(150,0,80,.18)}
.hero p{color:#fff;font-size:clamp(1rem,2vw,1.2rem);line-height:1.55;max-width:620px;margin:0 auto 28px}
.proof{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:22px!important;margin-bottom:0!important;font-size:.92rem!important;font-weight:700;color:#fff!important}
.proof span{display:inline-flex;align-items:center;gap:6px}
.check{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#fff;color:var(--green-2);font-size:.72rem;font-weight:900}

/* ---------- Buttons ---------- */
.cta{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;gap:14px;min-height:68px;
  padding:10px 28px 10px 10px;border-radius:999px;text-decoration:none;color:#fff;text-align:left;
  background:linear-gradient(180deg,#22dd55 0%,var(--green) 55%,var(--green-2) 100%);
  box-shadow:0 6px 0 #04801f,0 14px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .18s ease;animation:breathe 2.6s ease-in-out infinite}
.cta::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
.cta:hover{transform:translateY(-3px)}
.cta:active{transform:translateY(3px)}
.cta:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.cta-ico{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.cta-ico svg{width:25px;height:25px;fill:var(--green-2)}
.cta-txt{display:flex;flex-direction:column;line-height:1.1}
.cta-txt b{font-size:1.08rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.cta-txt small{font-size:.8rem;font-weight:500;opacity:.92;margin-top:3px}
.cta-arrow{margin-left:4px;font-size:1.3rem;font-weight:800;transition:transform .2s}
.cta:hover .cta-arrow{transform:translateX(4px)}

/* ---------- Store marquee ---------- */
.brand-wrap{background:var(--pink-pale);padding:20px 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.brand-track{display:flex;gap:14px;width:max-content;animation:marquee 34s linear infinite}
.brand-wrap:hover .brand-track{animation-play-state:paused}
.store{flex:none;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #f6d3e6;border-radius:14px;padding:12px 20px;
  box-shadow:0 6px 16px rgba(196,21,122,.08);font-weight:800;font-size:1.05rem;white-space:nowrap}
.store i{font-style:normal}
.natura{color:#168343;font-family:Georgia,serif}.avon{color:#b31d93;letter-spacing:2px}.wella{font-style:italic;color:#241020}
.boticario{color:#16824a}.loreal{color:#241020}.mercado{color:#264b99}.shopee{color:#e0611a}.amazon{color:#241020}.more{color:var(--pink-deep)}

/* ---------- Benefits ---------- */
.benefits{background:var(--pink-soft);padding:46px 20px 50px}
.benefit-grid{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.benefit-block{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:26px 24px;
  box-shadow:0 10px 26px rgba(150,0,80,.08)}
.benefit-block h2{font-family:var(--head);font-weight:800;font-size:clamp(1.25rem,2.5vw,1.6rem);line-height:1.15;margin:0 0 18px;letter-spacing:-.4px}
.benefit-block h3{font-size:.95rem;margin:0 0 12px;color:var(--pink-deep);text-transform:uppercase;letter-spacing:1px}
.benefit-block ul{padding:0;margin:0;list-style:none;display:grid;gap:12px}
.benefit-block li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.mk{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.72rem;font-weight:900;color:#fff;margin-top:1px}
.good{background:#00a94a}.tip{background:#e84c67}

/* ---------- Offers ---------- */
.offers{padding:60px 20px 64px;text-align:center;background:linear-gradient(145deg,#ff58b7,#ff2ba0)}
.section-title{font-family:var(--head);font-weight:800;color:var(--yellow);font-size:clamp(2rem,4.5vw,3.4rem);line-height:1.03;letter-spacing:-1px;margin:0 auto 12px;max-width:780px}
.section-copy{color:#fff;line-height:1.55;max-width:650px;margin:0 auto 30px}
.chat-preview{max-width:980px;margin:0 auto 28px;background:#fff;border-radius:20px;overflow:hidden;
  box-shadow:0 0 0 7px rgba(255,255,255,.6),0 24px 50px rgba(95,0,55,.28)}
.chat-top{display:flex;align-items:center;gap:10px;background:#075e3e;color:#fff;padding:11px 16px;text-align:left}
.chat-top .av{width:34px;height:34px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.6rem;line-height:1;text-align:center}
.chat-top b{display:block;font-size:.92rem}.chat-top small{opacity:.8;font-size:.74rem}
.chat-preview img{width:100%;height:auto}
.preview-caption{background:#fff0fa;padding:12px 16px;font-size:.85rem;color:#60304e;line-height:1.45}
.offer-points{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:920px;margin:30px auto 32px;text-align:left}
.offer-point{background:rgba(255,255,255,.96);padding:20px;border-radius:18px;box-shadow:0 10px 24px rgba(95,0,55,.12);transition:transform .25s ease}
